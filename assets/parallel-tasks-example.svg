<?xml version="1.0" encoding="UTF-8"?>
<!--
  公众号 SVG SMIL 并行任务动效模板
  1. 直接修改三组任务文字和交付时间。
  2. 主循环为 6 秒；修改时长时需同步调整所有 dur 与 keyTimes。
  3. 无 JavaScript、无外部图片、无 CSS 动画；请以 inline SVG 方式插入正文。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 720" width="750" height="720"
  font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">一句话，并行完成三项任务</title>
  <desc id="svgDesc">三项任务同时开始，分别加载，并按不同时间完成交付。</desc>

  <rect x="0" y="0" width="750" height="720" rx="8" fill="#F6F1E7"/>
  <text x="375" y="58" text-anchor="middle" font-size="17" fill="#92968F">PARALLEL TASKS · SVG SMIL</text>
  <text x="375" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#242622">一句话，并行完成三项任务</text>
  <line x1="70" y1="145" x2="680" y2="145" stroke="#D9D4C9"/>

  <!-- 用户需求 -->
  <rect x="170" y="175" width="510" height="82" rx="16" fill="#E4F2ED"/>
  <text x="195" y="208" font-size="17" fill="#3F4641">请基于现有素材，同时完成海报、文案和清单。</text>
  <text x="195" y="236" font-size="17" fill="#3F4641">三项互不影响，一起做。</text>

  <!-- 回复气泡：淡入并上移 10 px -->
  <g>
    <animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.1;0.1583;0.2167;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
      dur="6s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 10;0 0;0 0"
      keyTimes="0;0.1;0.1583;0.2333;1" calcMode="spline"
      keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
      dur="6s" begin="0s" repeatCount="indefinite"/>
    <rect x="90" y="282" width="500" height="65" rx="16" fill="#ECEAE4"/>
    <text x="112" y="310" font-size="16" fill="#4A4E49">收到，我会拆成三条并行任务，</text>
    <text x="112" y="333" font-size="16" fill="#4A4E49">完成后分别交付。</text>
  </g>

