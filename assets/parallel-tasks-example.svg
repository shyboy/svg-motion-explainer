<?xml version="1.0" encoding="UTF-8"?>
<!--
  示例（不是模板）：一句话需求拆成三条并行任务，同时开工、各自完成。
  它演示的是写法，不是版式：
  - 6 秒主循环；三张任务卡同时入场，分别在 2.5s / 3.0s / 3.9s 完成；
  - 0.9 秒的 discrete 8 点加载器只在等待阶段可见；
  - 静态定位写在外层 <g>，位移、缩放动画写在内层 <g>；
  - 每个 values 的第一项就是完整画面，暂停或不支持 SMIL 时也能读懂。
  为新文章作图时，请从原文的关系重新设计构图与时序，不要只替换这里的文字。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 760" width="750" height="760"
  font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" role="img" aria-labelledby="ex-parallel-title ex-parallel-desc">
  <title id="ex-parallel-title">一句话，并行完成三项任务</title>
  <desc id="ex-parallel-desc">三项任务同时开始，分别加载，并按不同时间完成交付。</desc>

  <rect x="0" y="0" width="750" height="760" rx="8" fill="#F6F1E7"/>
  <text x="375" y="58" text-anchor="middle" font-size="20" letter-spacing="2" fill="#92968F">PARALLEL TASKS · SVG SMIL</text>
  <text x="375" y="112" text-anchor="middle" font-size="38" font-weight="700" fill="#242622">一句话，并行完成三项任务</text>
  <line x1="70" y1="145" x2="680" y2="145" stroke="#D9D4C9"/>

  <!-- 用户需求 -->
  <rect x="160" y="172" width="520" height="96" rx="18" fill="#E4F2ED"/>
  <text x="184" y="210" font-size="22" fill="#3F4641">请基于现有素材，同时完成海报、文案和清单。</text>
  <text x="184" y="246" font-size="22" fill="#3F4641">三项互不影响，一起做。</text>

  <!-- 回复气泡：淡入并上移 10 px -->
  <g>
    <animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.1;0.1583;0.2167;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
      dur="6s" begin="0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 10;0 0;0 0"
      keyTimes="0;0.1;0.1583;0.2333;1" calcMode="spline"
      keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
      dur="6s" begin="0s" repeatCount="indefinite"/>
    <rect x="70" y="288" width="520" height="86" rx="18" fill="#ECEAE4"/>
    <text x="94" y="324" font-size="22" fill="#4A4E49">收到，我会拆成三条并行任务，</text>
    <text x="94" y="358" font-size="22" fill="#4A4E49">完成后分别交付。</text>
  </g>

  <!-- 并行状态标签 -->
  <g>
    <animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.1;0.2583;0.2917;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
      dur="6s" begin="0s" repeatCount="indefinite"/>
    <rect x="490" y="390" width="180" height="40" rx="20" fill="#CF4436"/>
    <text x="580" y="417" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">三条线同时开工</text>
  </g>

  
  <!-- 任务卡：修改文字与交付时间；完成时机由对应 keyTimes 控制 -->
  <g transform="translate(90 448)">
    <g>
      <animate attributeName="opacity" values="1;0;0;1;1" keyTimes="0;0.1;0.225;0.2833;1"
        calcMode="spline" keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
        dur="6s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 8;0 0;0 0"
