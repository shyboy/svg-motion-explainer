ill="#8E938D" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;0.25;0.25;0.25;0.25;1;0.25;0.25" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" calcMode="discrete" dur="0.9s" begin="0s" repeatCount="indefinite"/></circle><circle cx="-8.4853" cy="-8.4853" r="2.2" fill="#8E938D" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;0.25;0.25;0.25;0.25;0.25;1;0.25" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" calcMode="discrete" dur="0.9s" begin="0s" repeatCount="indefinite"/></circle></g></g>

