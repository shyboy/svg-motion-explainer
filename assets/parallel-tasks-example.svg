        keySplines="0.42 0 0.58 1;0 0 1 1;0.16 1 0.3 1;0 0 1 1"
        dur="6s" begin="0s" repeatCount="indefinite"/>

      <rect x="0" y="0" width="420" height="64" rx="32" fill="#FFFFFF" stroke="#E5E1D8"/>
      <path d="M24 22h13l4 4h15v18H24z" fill="none" stroke="#30322F" stroke-width="2"/>
      <path d="M24 30h32" stroke="#30322F" stroke-width="2"/>
      <text x="72" y="41" font-size="24" fill="#30322F">制作活动海报</text>

